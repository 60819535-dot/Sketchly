<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión | Sketchly</title>

    <!-- CSS GENERAL -->
    <link rel="stylesheet" href="css/style.css">

    <!-- CSS EXCLUSIVO DEL LOGIN -->
    <link rel="stylesheet" href="css/login.css">

    <!-- FUENTE -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

</head>


<body>


<!-- =====================================================
     HEADER ORIGINAL DE SKETCHLY
===================================================== -->

<header class="header">

    <a href="index.html" class="brand">

        <img
            src="img/logo.png"
            alt="Sketchly"
            class="main-logo"
        >

    </a>


    <nav class="nav">

        <a href="index.html">
            Inicio
        </a>

        <a href="portafolio.html">
            Portafolio
        </a>

        <a href="solicitud.html">
            Solicitar diseño
        </a>

        <a href="historial.html">
            Historial
        </a>

        <a href="contacto.html">
            Contacto
        </a>

    </nav>


    <!-- LOGIN -->

    <a
        href="login.html"
        class="user-button"
        title="Iniciar sesión"
    >

        <img
            src="img/login.png"
            alt="Iniciar sesión"
        >

    </a>

</header>



<!-- =====================================================
     LOGIN / REGISTRO
===================================================== -->

<main>

<section class="auth-section">


    <!-- DECORACIONES -->

    <div class="auth-bg auth-bg-left"></div>

    <div class="auth-bg auth-bg-right"></div>



    <!-- =================================================
         COLUMNA IZQUIERDA
    ================================================== -->

    <div class="auth-intro">


        <h1>
            Bienvenido a
            <br>
            Sketch<span>ly</span>
        </h1>


        <p id="introText">

            Inicia sesión o crea tu cuenta
            <br>
            para comenzar a dar vida
            <br>
            a tus ideas.

        </p>


        <!-- GATO -->

        <div class="auth-cat">

            <div class="auth-cat-glow"></div>

            <img
                src="img/gato.png"
                alt="Mascota de Sketchly"
            >

        </div>


    </div>



    <!-- =================================================
         TARJETA
    ================================================== -->

    <div class="auth-card">


        <!-- =================================================
             PESTAÑAS
        ================================================== -->

        <div class="auth-tabs">


            <button
                type="button"
                class="auth-tab active"
                id="loginTab"
            >

                Iniciar sesión

            </button>


            <button
                type="button"
                class="auth-tab"
                id="registerTab"
            >

                Crear cuenta

            </button>


        </div>



        <!-- =================================================
             FORMULARIO LOGIN
        ================================================== -->

        <form
            id="loginForm"
            class="auth-form active-form"
        >


            <!-- CORREO -->

            <div class="form-group">

                <label for="loginEmail">
                    Correo electrónico
                </label>

                <div class="input-wrapper">

                    <span class="input-icon">
                        ✉
                    </span>

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="ejemplo@gmail.com"
                        required
                    >

                </div>

            </div>



            <!-- CONTRASEÑA -->

            <div class="form-group">

                <label for="loginPassword">
                    Contraseña
                </label>

                <div class="input-wrapper">

                    <span class="input-icon">
                        ♙
                    </span>

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Ingresa tu contraseña"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        onclick="togglePassword('loginPassword', this)"
                    >
                        ◉
                    </button>

                </div>

            </div>



            <!-- OPCIONES -->

            <div class="login-options">


                <label class="remember">

                    <input
                        type="checkbox"
                        id="remember"
                    >

                    <span>
                        Recordarme
                    </span>

                </label>


                <a
                    href="#"
                    id="forgotPassword"
                >
                    ¿Olvidaste tu contraseña?
                </a>


            </div>



            <!-- BOTÓN -->

            <button
                type="submit"
                class="auth-button"
            >

                <span>
                    ➜
                </span>

                Iniciar sesión

            </button>



            <!-- SEPARADOR -->

            <div class="separator">

                <span></span>

                <p>
                    o continúa con
                </p>

                <span></span>

            </div>



            <!-- GOOGLE -->

            <button
                type="button"
                class="google-button"
                id="googleButton"
            >

                <span class="google-icon">
                    G
                </span>

                Continuar con Google

            </button>



            <!-- CAMBIO A REGISTRO -->

            <p class="bottom-text">

                ¿No tienes cuenta?

                <button
                    type="button"
                    class="switch-button"
                    id="goRegister"
                >
                    Crear cuenta
                </button>

            </p>


        </form>



        <!-- =================================================
             FORMULARIO REGISTRO
        ================================================== -->

        <form
            id="registerForm"
            class="auth-form"
        >


            <!-- NOMBRE -->

            <div class="form-group">

                <label for="registerName">
                    Nombre completo
                </label>

                <div class="input-wrapper">

                    <span class="input-icon">
                        ●
                    </span>

                    <input
                        type="text"
                        id="registerName"
                        placeholder="Ingresa tu nombre"
                        required
                    >

                </div>

            </div>



            <!-- CORREO -->

            <div class="form-group">

                <label for="registerEmail">
                    Correo electrónico
                </label>

                <div class="input-wrapper">

                    <span class="input-icon">
                        ✉
                    </span>

                    <input
                        type="email"
                        id="registerEmail"
                        placeholder="ejemplo@gmail.com"
                        required
                    >

                </div>

            </div>



            <!-- CONTRASEÑA -->

            <div class="form-group">

                <label for="registerPassword">
                    Contraseña
                </label>

                <div class="input-wrapper">

                    <span class="input-icon">
                        ♙
                    </span>

                    <input
                        type="password"
                        id="registerPassword"
                        placeholder="Crea una contraseña"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        onclick="togglePassword('registerPassword', this)"
                    >
                        ◉
                    </button>

                </div>

            </div>



            <!-- CONFIRMAR CONTRASEÑA -->

            <div class="form-group">

                <label for="confirmPassword">
                    Confirmar contraseña
                </label>

                <div class="input-wrapper">

                    <span class="input-icon">
                        ♙
                    </span>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Repite tu contraseña"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        onclick="togglePassword('confirmPassword', this)"
                    >
                        ◉
                    </button>

                </div>

            </div>



            <!-- BOTÓN REGISTRO -->

            <button
                type="submit"
                class="auth-button"
            >

                <span>
                    ✦
                </span>

                Crear cuenta

            </button>



            <!-- GOOGLE -->

            <div class="separator">

                <span></span>

                <p>
                    o continúa con
                </p>

                <span></span>

            </div>


            <button
                type="button"
                class="google-button"
                id="googleRegisterButton"
            >

                <span class="google-icon">
                    G
                </span>

                Registrarse con Google

            </button>



            <!-- CAMBIO A LOGIN -->

            <p class="bottom-text">

                ¿Ya tienes una cuenta?

                <button
                    type="button"
                    class="switch-button"
                    id="goLogin"
                >
                    Iniciar sesión
                </button>

            </p>


        </form>


    </div>

</section>

</main>



<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script>


/* =====================================================
   ELEMENTOS
===================================================== */

const loginTab =
    document.getElementById("loginTab");

const registerTab =
    document.getElementById("registerTab");

const loginForm =
    document.getElementById("loginForm");

const registerForm =
    document.getElementById("registerForm");

const goRegister =
    document.getElementById("goRegister");

const goLogin =
    document.getElementById("goLogin");

const introText =
    document.getElementById("introText");



/* =====================================================
   CAMBIAR A LOGIN
===================================================== */

function showLogin() {

    loginTab.classList.add("active");

    registerTab.classList.remove("active");

    loginForm.classList.add("active-form");

    registerForm.classList.remove("active-form");


    introText.innerHTML = `

        Inicia sesión o crea tu cuenta
        <br>
        para comenzar a dar vida
        <br>
        a tus ideas.

    `;

}



/* =====================================================
   CAMBIAR A REGISTRO
===================================================== */

function showRegister() {

    registerTab.classList.add("active");

    loginTab.classList.remove("active");

    registerForm.classList.add("active-form");

    loginForm.classList.remove("active-form");


    introText.innerHTML = `

        Crea tu cuenta y comienza
        <br>
        a convertir tus ideas
        <br>
        en diseños únicos.

    `;

}



/* =====================================================
   EVENTOS DE PESTAÑAS
===================================================== */

loginTab.addEventListener(
    "click",
    showLogin
);


registerTab.addEventListener(
    "click",
    showRegister
);


goRegister.addEventListener(
    "click",
    showRegister
);


goLogin.addEventListener(
    "click",
    showLogin
);



/* =====================================================
   MOSTRAR / OCULTAR CONTRASEÑA
===================================================== */

function togglePassword(inputId, button) {

    const input =
        document.getElementById(inputId);


    if (input.type === "password") {

        input.type = "text";

        button.textContent = "◉";

    } else {

        input.type = "password";

        button.textContent = "◉";

    }

}



/* =====================================================
   LOGIN
===================================================== */

loginForm.addEventListener(
    "submit",
    function(event) {

        event.preventDefault();


        const email =
            document.getElementById("loginEmail").value;

        const password =
            document.getElementById("loginPassword").value;


        if (!email || !password) {

            alert(
                "Completa todos los campos."
            );

            return;

        }


        alert(
            "¡Inicio de sesión realizado correctamente! ✦"
        );

    }
);



/* =====================================================
   REGISTRO
===================================================== */

registerForm.addEventListener(
    "submit",
    function(event) {

        event.preventDefault();


        const name =
            document.getElementById("registerName").value.trim();

        const email =
            document.getElementById("registerEmail").value.trim();

        const password =
            document.getElementById("registerPassword").value;

        const confirmPassword =
            document.getElementById("confirmPassword").value;


        /* VALIDAR */

        if (
            !name ||
            !email ||
            !password ||
            !confirmPassword
        ) {

            alert(
                "Completa todos los campos."
            );

            return;

        }


        if (password.length < 6) {

            alert(
                "La contraseña debe tener al menos 6 caracteres."
            );

            return;

        }


        if (password !== confirmPassword) {

            alert(
                "Las contraseñas no coinciden."
            );

            return;

        }


        /* REGISTRO DE DEMOSTRACIÓN */

        alert(
            "¡Cuenta creada correctamente! ✦"
        );


        registerForm.reset();


        showLogin();


        document.getElementById(
            "loginEmail"
        ).value = email;


    }
);



/* =====================================================
   GOOGLE
===================================================== */

document.getElementById(
    "googleButton"
).addEventListener(
    "click",
    function() {

        alert(
            "La conexión con Google estará disponible cuando se conecte el sistema de autenticación."
        );

    }
);


document.getElementById(
    "googleRegisterButton"
).addEventListener(
    "click",
    function() {

        alert(
            "El registro con Google estará disponible cuando se conecte el sistema de autenticación."
        );

    }
);



/* =====================================================
   RECUPERAR CONTRASEÑA
===================================================== */

document.getElementById(
    "forgotPassword"
).addEventListener(
    "click",
    function(event) {

        event.preventDefault();

        alert(
            "La recuperación de contraseña estará disponible cuando se conecte el sistema de autenticación."
        );

    }
);


</script>


</body>

</html>
