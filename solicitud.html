<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Solicitar diseño | Sketchly</title>

    <!-- CSS GENERAL DEL SITIO -->
    <link rel="stylesheet" href="css/style.css">

    <!-- CSS EXCLUSIVO DE SOLICITUD -->
    <link rel="stylesheet" href="css/solicitud.css">

    <!-- FUENTE -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">

    <a href="index.html" class="brand">

        <img
            src="img/logo.png"
            alt="Sketchly"
            class="main-logo"
        >

    </a>


    <nav class="nav">

        <a href="index.html">
            Inicio
        </a>

        <a href="portafolio.html">
            Portafolio
        </a>

        <a href="solicitud.html" class="active">
            Solicitar diseño
        </a>

        <a href="historial.html">
            Historial
        </a>

        <a href="contacto.html">
            Contacto
        </a>

    </nav>


    <!-- LOGIN -->

    <a
        href="login.html"
        class="user-button"
        title="Iniciar sesión"
    >

        <img
            src="img/login.png"
            alt="Iniciar sesión"
        >

    </a>

</header>



<!-- =====================================================
     SOLICITAR DISEÑO
===================================================== -->

<main>

<section class="request-section">


    <!-- DECORACIONES -->

    <div class="request-bg bg-left"></div>

    <div class="request-bg bg-right"></div>



    <!-- =================================================
         COLUMNA IZQUIERDA
    ================================================== -->

    <div class="request-intro">

        <span class="request-label">
            CREA ALGO ÚNICO
        </span>


        <h1>
            Solicitar
            <span>diseño</span>
        </h1>


        <p class="request-description">
            Cuéntanos tu idea y sube imágenes
            <br>
            de referencia.
        </p>



        <!-- GATO -->

        <div class="request-cat">

            <div class="request-cat-glow"></div>

            <img
                src="img/gato.png"
                alt="Mascota de Sketchly"
            >

        </div>

    </div>



    <!-- =================================================
         FORMULARIO
    ================================================== -->

    <div class="request-card">

        <form id="designForm">


            <!-- FILA 1 -->

            <div class="form-row">


                <div class="form-group">

                    <label for="nombre">
                        Nombre completo
                    </label>

                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        placeholder="Ingresa tu nombre"
                        required
                    >

                </div>



                <div class="form-group">

                    <label for="correo">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="correo"
                        name="correo"
                        placeholder="ejemplo@gmail.com"
                        required
                    >

                </div>


            </div>



            <!-- TIPO DE DISEÑO -->

            <div class="form-group">

                <label for="tipo">
                    Tipo de diseño
                </label>

                <select
                    id="tipo"
                    name="tipo"
                    required
                >

                    <option value="" selected disabled>
                        Selecciona una opción
                    </option>

                    <option value="personajes">
                        Personajes
                    </option>

                    <option value="escenarios">
                        Escenarios
                    </option>

                    <option value="logotipos">
                        Logotipos
                    </option>

                    <option value="pixel-art">
                        Pixel Art
                    </option>

                    <option value="ilustracion">
                        Ilustración
                    </option>

                </select>

            </div>



            <!-- DESCRIPCIÓN -->

            <div class="form-group">

                <label for="descripcion">
                    Describe tu idea
                </label>

                <textarea
                    id="descripcion"
                    name="descripcion"
                    placeholder="Describe cómo quieres tu diseño..."
                    required
                ></textarea>

            </div>



            <!-- FECHA -->

            <div class="form-group">

                <label for="fecha">
                    Fecha límite
                </label>

                <input
                    type="date"
                    id="fecha"
                    name="fecha"
                    required
                >

            </div>



            <!-- IMAGEN -->

            <div class="form-group">

                <label for="referencias">
                    Imágenes de referencia
                    <span>(opcional)</span>
                </label>


                <div class="file-input">

                    <span class="file-icon">
                        ▧
                    </span>

                    <span
                        class="file-text"
                        id="fileText"
                    >
                        Ningún archivo seleccionado
                    </span>

                    <input
                        type="file"
                        id="referencias"
                        name="referencias"
                        accept="image/*"
                    >

                </div>

            </div>



            <!-- MENSAJE DE ESTADO -->

            <p
                id="solicitudMensaje"
                role="status"
                aria-live="polite"
            ></p>



            <!-- BOTÓN -->

            <button
                type="submit"
                class="submit-button"
            >

                <span>➤</span>

                Enviar solicitud

            </button>


        </form>

    </div>

</section>

</main>



<!-- =====================================================
     CHATBOT
===================================================== -->

<div class="chatbot">


    <button
        class="chatbot-button"
        id="chatbotButton"
        type="button"
        aria-label="Abrir asistente"
    >

        <span>✦</span>

    </button>



    <div
        class="chatbot-window"
        id="chatbotWindow"
    >


        <div class="chatbot-header">

            <div>

                <strong>
                    Sketchly
                </strong>

                <small>
                    Asistente virtual
                </small>

            </div>


            <button
                id="closeChat"
                type="button"
            >
                ×
            </button>

        </div>



        <div
            class="chatbot-messages"
            id="chatMessages"
        >

            <div class="bot-message">

                ¡Hola! 👋
                <br><br>

                Soy el asistente de Sketchly.
                ¿Qué necesitas?

            </div>

        </div>



        <div class="chatbot-options">

            <button
                type="button"
                onclick="botReply('portafolio')"
            >
                🎨 Ver estilos
            </button>


            <button
                type="button"
                onclick="botReply('solicitud')"
            >
                ✎ Solicitar diseño
            </button>


            <button
                type="button"
                onclick="botReply('contacto')"
            >
                💬 Contactar artista
            </button>

        </div>


    </div>

</div>



<!-- =====================================================
     JAVASCRIPT CON SUPABASE
===================================================== -->

<script type="module">

import { supabase } from './js/supabase.js';


/* =====================================================
   ELEMENTOS DEL FORMULARIO
===================================================== */

const form = document.getElementById('designForm');

const nombreInput = document.getElementById('nombre');

const correoInput = document.getElementById('correo');

const tipoInput = document.getElementById('tipo');

const descripcionInput = document.getElementById('descripcion');

const fechaInput = document.getElementById('fecha');

const fileInput = document.getElementById('referencias');

const fileText = document.getElementById('fileText');

const mensaje = document.getElementById('solicitudMensaje');

const botonEnviar = form.querySelector('button[type="submit"]');


/* =====================================================
   CONFIGURACIÓN DE ARCHIVOS
===================================================== */

const TAMANO_MAXIMO = 10 * 1024 * 1024;

const TIPOS_PERMITIDOS = [
    'image/jpeg',
    'image/png',
    'image/webp'
];

const BUCKET_REFERENCIAS = 'sketchly-files';


/* =====================================================
   MOSTRAR MENSAJES
===================================================== */

function mostrarMensaje(texto, tipo = 'info') {

    mensaje.textContent = texto;

    mensaje.dataset.tipo = tipo;

}


/* =====================================================
   FECHA MÍNIMA
===================================================== */

const fechaActual = new Date();

const anio = fechaActual.getFullYear();

const mes = String(
    fechaActual.getMonth() + 1
).padStart(2, '0');

const dia = String(
    fechaActual.getDate()
).padStart(2, '0');

fechaInput.min = `${anio}-${mes}-${dia}`;


/* =====================================================
   COMPROBAR SESIÓN Y RELLENAR DATOS
===================================================== */

async function comprobarSesion() {

    try {

        const { data, error } = await supabase.auth.getUser();

        if (error) {
            throw error;
        }

        const usuario = data.user;

        if (!usuario) {

            window.location.href =
                'login.html?next=solicitud.html';

            return null;

        }

        nombreInput.value =
            usuario.user_metadata?.full_name ||
            usuario.user_metadata?.name ||
            '';

        correoInput.value =
            usuario.email || '';

        nombreInput.readOnly = true;

        correoInput.readOnly = true;

        return usuario;

    } catch (error) {

        console.error(
            'Error al comprobar la sesión:',
            error
        );

        mostrarMensaje(
            'No se pudo comprobar tu sesión. Recarga la página o vuelve a iniciar sesión.',
            'error'
        );

        return null;

    }

}


/* =====================================================
   ACTUALIZAR NOMBRE DEL ARCHIVO
===================================================== */

fileInput.addEventListener('change', function () {

    const archivo = fileInput.files[0];

    if (!archivo) {

        fileText.textContent =
            'Ningún archivo seleccionado';

        mostrarMensaje('');

        return;

    }

    fileText.textContent = archivo.name;

    const errorArchivo = validarImagen(archivo);

    if (errorArchivo) {

        mostrarMensaje(errorArchivo, 'error');

        return;

    }

    mostrarMensaje(
        'Imagen seleccionada correctamente.',
        'success'
    );

});


/* =====================================================
   VALIDAR IMAGEN
===================================================== */

function validarImagen(archivo) {

    if (!archivo) {
        return null;
    }

    if (!TIPOS_PERMITIDOS.includes(archivo.type)) {

        return 'Formato no permitido. Selecciona una imagen JPG, PNG o WEBP.';

    }

    if (archivo.size > TAMANO_MAXIMO) {

        return 'La imagen no debe superar los 10 MB.';

    }

    return null;

}


/* =====================================================
   SUBIR IMAGEN DE REFERENCIA
===================================================== */

async function subirImagen(archivo, usuarioId) {

    if (!archivo) {
        return null;
    }

    const errorArchivo = validarImagen(archivo);

    if (errorArchivo) {
        throw new Error(errorArchivo);
    }

    const extensionPorTipo = {
        'image/jpeg': 'jpg',
        'image/png': 'png',
        'image/webp': 'webp'
    };

    const extension = extensionPorTipo[archivo.type];

    const rutaArchivo =
        `${usuarioId}/${crypto.randomUUID()}.${extension}`;

    const { error } = await supabase.storage
        .from(BUCKET_REFERENCIAS)
        .upload(rutaArchivo, archivo, {
            contentType: archivo.type,
            upsert: false
        });

    if (error) {
        throw error;
    }

    return rutaArchivo;

}


/* =====================================================
   ENVIAR SOLICITUD
===================================================== */

form.addEventListener('submit', async function (event) {

    event.preventDefault();

    mostrarMensaje('');

    const nombre = nombreInput.value.trim();

    const correo = correoInput.value.trim();

    const tipo = tipoInput.value;

    const descripcion = descripcionInput.value.trim();

    const fecha = fechaInput.value;

    const archivo = fileInput.files[0] || null;


    /* VALIDAR CAMPOS */

    if (
        !nombre ||
        !correo ||
        !tipo ||
        !descripcion ||
        !fecha
    ) {

        mostrarMensaje(
            'Completa todos los campos obligatorios.',
            'error'
        );

        return;

    }


    /* VALIDAR FECHA */

    if (fecha < fechaInput.min) {

        mostrarMensaje(
            'La fecha límite no puede ser anterior a hoy.',
            'error'
        );

        return;

    }


    /* VALIDAR IMAGEN */

    if (archivo) {

        const errorArchivo = validarImagen(archivo);

        if (errorArchivo) {

            mostrarMensaje(
                errorArchivo,
                'error'
            );

            return;

        }

    }


    botonEnviar.disabled = true;

    botonEnviar.textContent = 'Enviando solicitud...';


    let rutaSubida = null;

    let solicitudCreada = false;

    try {

        /* COMPROBAR SESIÓN */

        const { data: usuarioData, error: usuarioError } =
            await supabase.auth.getUser();

        if (usuarioError) {
            throw usuarioError;
        }

        const usuario = usuarioData.user;

        if (!usuario) {

            window.location.href =
                'login.html?next=solicitud.html';

            return;

        }


        /* SUBIR IMAGEN SI EXISTE */

        if (archivo) {

            mostrarMensaje(
                'Subiendo imagen de referencia...',
                'info'
            );

            rutaSubida = await subirImagen(
                archivo,
                usuario.id
            );

        }


        /* REGISTRAR SOLICITUD EN SUPABASE */

        mostrarMensaje(
            'Registrando tu solicitud...',
            'info'
        );

        const datosSolicitud = {
            user_id: usuario.id,
            title: tipo,
            description: descripcion,
            customer_name: nombre,
            customer_email: correo,
            design_type: tipo,
            due_date: fecha,
            reference_path: rutaSubida,
            status: 'pendiente'
        };

        const { data, error } = await supabase
            .from('orders')
            .insert(datosSolicitud)
            .select()
            .single();

        if (error) {
            throw error;
        }

        solicitudCreada = true;


        /* CONFIRMAR ENVÍO */

        mostrarMensaje(
            '¡Solicitud enviada correctamente! ✦',
            'success'
        );

        form.reset();

        fileText.textContent =
            'Ningún archivo seleccionado';

        nombreInput.value = nombre;

        correoInput.value = correo;

    } catch (error) {

        console.error(
            'Error al enviar la solicitud:',
            error
        );


        /*
         * Si la imagen se subió pero la solicitud falló,
         * intentamos eliminar el archivo para evitar
         * dejar referencias sin una solicitud asociada.
         */

        if (rutaSubida && !solicitudCreada) {

            const { error: errorEliminacion } =
                await supabase.storage
                    .from(BUCKET_REFERENCIAS)
                    .remove([rutaSubida]);

            if (errorEliminacion) {

                console.error(
                    'No se pudo eliminar la imagen subida:',
                    errorEliminacion
                );

            }

        }


        if (
            error.message &&
            error.message.toLowerCase().includes('row-level security')
        ) {

            mostrarMensaje(
                'Supabase bloqueó el registro. Revisa las políticas RLS de la tabla orders y del bucket sketchly-files.',
                'error'
            );

        } else {

            mostrarMensaje(
                'No se pudo enviar la solicitud. Verifica tu conexión y la configuración de Supabase.',
                'error'
            );

        }

    } finally {

        botonEnviar.disabled = false;

        botonEnviar.innerHTML =
            '<span>➤</span> Enviar solicitud';

    }

});


/* =====================================================
   INICIAR PÁGINA
===================================================== */

document.addEventListener('DOMContentLoaded', function () {

    comprobarSesion();

});


/* =====================================================
   CHATBOT
===================================================== */

const chatbotButton =
    document.getElementById('chatbotButton');

const chatbotWindow =
    document.getElementById('chatbotWindow');

const closeChat =
    document.getElementById('closeChat');


chatbotButton.addEventListener('click', function () {

    chatbotWindow.classList.toggle('show');

});


closeChat.addEventListener('click', function () {

    chatbotWindow.classList.remove('show');

});


/* =====================================================
   RESPUESTAS DEL CHATBOT
   Se usa window.botReply porque este script es un módulo
   y los botones HTML utilizan onclick.
===================================================== */

window.botReply = function (type) {

    const messages =
        document.getElementById('chatMessages');

    let userText = '';

    let botText = '';


    if (type === 'portafolio') {

        userText =
            'Quiero ver los estilos.';

        botText =
            'Puedes explorar nuestros estilos en <a href="portafolio.html">Portafolio →</a>';

    }


    if (type === 'solicitud') {

        userText =
            'Quiero solicitar un diseño.';

        botText =
            '¡Perfecto! Ya estás en la sección para solicitar tu diseño. Completa el formulario y cuéntanos tu idea.';

    }


    if (type === 'contacto') {

        userText =
            'Quiero contactar al artista.';

        botText =
            'Puedes comunicarte con el artista desde <a href="contacto.html">Contacto →</a>';

    }


    const userMessage =
        document.createElement('div');

    userMessage.className = 'user-message';

    userMessage.textContent = userText;


    const botMessage =
        document.createElement('div');

    botMessage.className =
        'bot-message chatbot-answer';

    botMessage.innerHTML = botText;


    messages.appendChild(userMessage);

    messages.appendChild(botMessage);


    messages.scrollTop =
        messages.scrollHeight;

};

</script>


</body>

</html>
