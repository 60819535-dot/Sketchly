<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Solicitar diseño | Sketchly</title>

    <!-- CSS GENERAL DEL SITIO -->
    <link rel="stylesheet" href="css/style.css">

    <!-- CSS EXCLUSIVO DE SOLICITUD -->
    <link rel="stylesheet" href="css/solicitud.css">

    <!-- FUENTE -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">

    <a href="index.html" class="brand">

        <img
            src="img/logo.png"
            alt="Sketchly"
            class="main-logo"
        >

    </a>


    <nav class="nav">

        <a href="index.html">
            Inicio
        </a>

        <a href="portafolio.html">
            Portafolio
        </a>

        <a href="solicitud.html" class="active">
            Solicitar diseño
        </a>

        <a href="historial.html">
            Historial
        </a>

        <a href="contacto.html">
            Contacto
        </a>

    </nav>


    <!-- LOGIN -->

    <a
        href="login.html"
        class="user-button"
        title="Iniciar sesión"
    >

        <img
            src="img/login.png"
            alt="Iniciar sesión"
        >

    </a>

</header>



<!-- =====================================================
     SOLICITAR DISEÑO
===================================================== -->

<main>

<section class="request-section">


    <!-- DECORACIONES -->

    <div class="request-bg bg-left"></div>
    <div class="request-bg bg-right"></div>



    <!-- =================================================
         COLUMNA IZQUIERDA
    ================================================== -->

    <div class="request-intro">

        <span class="request-label">
            CREA ALGO ÚNICO
        </span>


        <h1>
            Solicitar
            <span>diseño</span>
        </h1>


        <p class="request-description">
            Cuéntanos tu idea y sube imágenes
            <br>
            de referencia.
        </p>



        <!-- GATO -->

        <div class="request-cat">

            <div class="request-cat-glow"></div>

            <img
                src="img/gato.png"
                alt="Mascota de Sketchly"
            >

        </div>

    </div>



    <!-- =================================================
         FORMULARIO
    ================================================== -->

    <div class="request-card">


        <form id="designForm">


            <!-- FILA 1 -->

            <div class="form-row">


                <div class="form-group">

                    <label for="nombre">
                        Nombre completo
                    </label>

                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        placeholder="Ingresa tu nombre"
                        required
                    >

                </div>



                <div class="form-group">

                    <label for="correo">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="correo"
                        name="correo"
                        placeholder="ejemplo@gmail.com"
                        required
                    >

                </div>


            </div>



            <!-- TIPO DE DISEÑO -->

            <div class="form-group">

                <label for="tipo">
                    Tipo de diseño
                </label>

                <select
                    id="tipo"
                    name="tipo"
                    required
                >

                    <option value="" selected disabled>
                        Selecciona una opción
                    </option>

                    <option value="personajes">
                        Personajes
                    </option>

                    <option value="escenarios">
                        Escenarios
                    </option>

                    <option value="logotipos">
                        Logotipos
                    </option>

                    <option value="pixel-art">
                        Pixel Art
                    </option>

                    <option value="ilustracion">
                        Ilustración
                    </option>

                </select>

            </div>



            <!-- DESCRIPCIÓN -->

            <div class="form-group">

                <label for="descripcion">
                    Describe tu idea
                </label>

                <textarea
                    id="descripcion"
                    name="descripcion"
                    placeholder="Describe cómo quieres tu diseño..."
                    required
                ></textarea>

            </div>



            <!-- FECHA -->

            <div class="form-group">

                <label for="fecha">
                    Fecha límite
                </label>

                <input
                    type="date"
                    id="fecha"
                    name="fecha"
                    required
                >

            </div>



            <!-- IMAGEN -->

            <div class="form-group">

                <label for="referencias">
                    Imágenes de referencia
                    <span>(opcional)</span>
                </label>


                <div class="file-input">

                    <span class="file-icon">
                        ▧
                    </span>

                    <span
                        class="file-text"
                        id="fileText"
                    >
                        Ningún archivo seleccionado
                    </span>

                    <input
                        type="file"
                        id="referencias"
                        name="referencias"
                        accept="image/*"
                    >

                </div>

            </div>



            <!-- BOTÓN -->

            <button
                type="submit"
                class="submit-button"
            >

                <span>➤</span>

                Enviar solicitud

            </button>


        </form>

    </div>

</section>

</main>



<!-- =====================================================
     CHATBOT
===================================================== -->

<div class="chatbot">


    <button
        class="chatbot-button"
        id="chatbotButton"
        type="button"
        aria-label="Abrir asistente"
    >

        <span>✦</span>

    </button>



    <div
        class="chatbot-window"
        id="chatbotWindow"
    >


        <div class="chatbot-header">

            <div>

                <strong>
                    Sketchly
                </strong>

                <small>
                    Asistente virtual
                </small>

            </div>


            <button
                id="closeChat"
                type="button"
            >
                ×
            </button>

        </div>



        <div
            class="chatbot-messages"
            id="chatMessages"
        >

            <div class="bot-message">

                ¡Hola! 👋
                <br><br>

                Soy el asistente de Sketchly.
                ¿Qué necesitas?

            </div>

        </div>



        <div class="chatbot-options">

            <button
                type="button"
                onclick="botReply('portafolio')"
            >
                🎨 Ver estilos
            </button>


            <button
                type="button"
                onclick="botReply('solicitud')"
            >
                ✎ Solicitar diseño
            </button>


            <button
                type="button"
                onclick="botReply('contacto')"
            >
                💬 Contactar artista
            </button>

        </div>


    </div>

</div>



<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script>

document.addEventListener("DOMContentLoaded", function () {


    /* ==========================================
       CHATBOT
    ========================================== */

    const chatbotButton =
        document.getElementById("chatbotButton");

    const chatbotWindow =
        document.getElementById("chatbotWindow");

    const closeChat =
        document.getElementById("closeChat");


    chatbotButton.addEventListener("click", function () {

        chatbotWindow.classList.toggle("show");

    });


    closeChat.addEventListener("click", function () {

        chatbotWindow.classList.remove("show");

    });



    /* ==========================================
       ARCHIVO
    ========================================== */

    const fileInput =
        document.getElementById("referencias");

    const fileText =
        document.getElementById("fileText");


    fileInput.addEventListener("change", function () {

        if (fileInput.files.length > 0) {

            fileText.textContent =
                fileInput.files[0].name;

        } else {

            fileText.textContent =
                "Ningún archivo seleccionado";

        }

    });



    /* ==========================================
       FORMULARIO
    ========================================== */

    const form =
        document.getElementById("designForm");


    form.addEventListener("submit", function (event) {

        event.preventDefault();


        alert(
            "¡Solicitud enviada correctamente! ✦"
        );


        form.reset();

        fileText.textContent =
            "Ningún archivo seleccionado";

    });


});



/* ==========================================
   RESPUESTAS DEL CHATBOT
========================================== */

function botReply(type) {


    const messages =
        document.getElementById("chatMessages");


    let userText = "";
    let botText = "";


    if (type === "portafolio") {

        userText =
            "Quiero ver los estilos.";

        botText =
            'Puedes explorar nuestros estilos en <a href="portafolio.html">Portafolio →</a>';

    }


    if (type === "solicitud") {

        userText =
            "Quiero solicitar un diseño.";

        botText =
            '¡Perfecto! Ya estás en la sección para solicitar tu diseño. Completa el formulario y cuéntanos tu idea.';

    }


    if (type === "contacto") {

        userText =
            "Quiero contactar al artista.";

        botText =
            'Puedes comunicarte con el artista desde <a href="contacto.html">Contacto →</a>';

    }


    messages.innerHTML += `

        <div class="user-message">
            ${userText}
        </div>

        <div class="bot-message chatbot-answer">
            ${botText}
        </div>

    `;


    messages.scrollTop =
        messages.scrollHeight;

}

</script>


</body>

</html>
