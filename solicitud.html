<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Solicitar diseño | Sketchly</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <header>

        <h1>Sketchly</h1>

        <nav>

            <a href="index.html">Inicio</a>
            <a href="portafolio.html">Portafolio</a>
            <a href="solicitud.html">Solicitar diseño</a>
            <a href="contacto.html">Contacto</a>
            <a href="login.html">Iniciar sesión</a>

        </nav>

    </header>

    <main>

        <div class="formulario">

            <h2>Solicitar diseño 🎨</h2>

            <p class="subtitulo">
                Cuéntanos tu idea y sube imágenes de referencia.
            </p>

            <form>

                <label>Nombre completo</label>
                <input type="text" placeholder="Ingresa tu nombre" required>

                <label>Correo electrónico</label>
                <input type="email" placeholder="ejemplo@gmail.com" required>

                <label>Tipo de diseño</label>

                <select required>

                    <option value="">Selecciona una opción</option>
                    <option>Diseño de personaje</option>
                    <option>Pixel art</option>
                    <option>Ilustración</option>
                    <option>Logo</option>
                    <option>Otro</option>

                </select>

                <label>Describe tu idea</label>

                <textarea placeholder="Describe cómo quieres tu diseño..." rows="6" required></textarea>

                <label>Fecha límite</label>

                <input type="date">

                <label>Imágenes de referencia (opcional)</label>

                <input type="file" multiple accept="image/*">

                <button type="submit">Enviar solicitud</button>

            </form>

        </div>

    </main>

</body>

</html>
